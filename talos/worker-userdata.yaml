
#cloud-config
version: v1alpha1
debug: false
persist: true
machine:
  type: worker
  token: ${cluster_name}-token
  ca:
    crt: 
    key: LS0tLS1CRUdJTiBFQyBQUklWQVRFIEtFWS0tLS0tCk1IY0NBUUVFSUo5SDFmK1FhZzBLSTBJOXBmRHBYWWE5TVlrb0FnRUdDQ3FHU000OUF3RUhvVVFEUWdBRVdKOEgKVkNRN2dXdU5ZMTNaOFYrUE1IdFVQTy9BaVIrRi9ZSzhWSnBqSFhkWGlYdlpPSEM1eFBZYS9xd1pYS3hBUT09Ci0tLS0tRU5EIEVDIFBSSVZBVEUgS0VZLS0tLS0K
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.28.0
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
  network:
    hostname: ${cluster_name}-worker
    interfaces:
      - interface: eth0
        dhcp: true
      - interface: eth1
        dhcp: false
        addresses:
          - ${node_ip}/24
  install:
    disk: /dev/sda
    image: ghcr.io/siderolabs/installer:v1.6.0
    bootloader: true
    wipe: false
cluster:
  id: ${cluster_name}
  secret: ${cluster_name}-secret
  controlPlane:
    endpoint: https://${control_plane_ip}:6443
  clusterName: ${cluster_name}
